name: Build Bauloo Styler Remake

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build mod
        run: gradle build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: bauloo-styler-remake-1.21.0
          path: build/libs/*.jar
          if-no-files-found: error
