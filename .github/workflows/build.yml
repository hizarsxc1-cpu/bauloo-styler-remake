name: Build Bauloo Styler Remake

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build mod
        run: gradle clean build --no-build-cache --rerun-tasks --info
      - name: Debug jar outputs
        run: |
          find build -type f -name '*.jar' -print
          for f in $(find build -type f -name '*.jar'); do ls -l "$f"; echo "CONTENTS: $f"; jar tf "$f" | head -40; done
      - name: Verify mod JAR contents
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -name 'bauloo-styler-remake-*.jar' ! -name '*sources.jar' | head -n 1)"
          test -n "$JAR"
          echo "Checking $JAR"
          jar tf "$JAR" | tee jar-contents.txt
          grep -q 'fabric.mod.json' jar-contents.txt
          grep -q 'BaulooStylerClient.class' jar-contents.txt
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: bauloo-styler-remake-1.21.0
          path: build/libs/bauloo-styler-remake-*.jar
          if-no-files-found: error
